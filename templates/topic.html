<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>What the Bible says about {{ topic_name }} | WWAIJD</title>
    <meta name="description" content="{% if overview %}{{ overview[:155] }}...{% else %}Discover key Bible verses and passages about {{ topic_name|lower }}.{% endif %}">
    <link rel="canonical" href="{{ canonical_url }}">

    <link rel="stylesheet" href="/static/style.css">
    <style>
        .topic-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            color: var(--text-color);
        }
        .passage-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .passage-reference {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-decoration: none;
            display: inline-block;
        }
        .passage-reference:hover {
            text-decoration: underline;
        }
        .passage-text {
            line-height: 1.6;
            font-size: 1.05rem;
            margin-top: 0.5rem;
            border-left: 4px solid rgba(255, 255, 255, 0.1);
            padding-left: 1rem;
            color: var(--text-color);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="topic-container">
        <header style="margin-bottom: 2rem;">
            <a href="/topics" style="color: var(--accent); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← All Topics</a>
            <h1 style="text-transform: capitalize;">What the Bible says about: {{ topic_name }}</h1>
        </header>

        {% if overview %}
        <div class="topic-overview" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.8rem; margin-bottom: 2.5rem; border-left: 4px solid var(--accent); line-height: 1.7; font-size: 1.1rem; color: var(--text-color);">
            <h2 style="margin-top: 0; font-size: 1.4rem; color: var(--accent); margin-bottom: 0.8rem;">Devotional Guidance</h2>
            <div class="overview-text" style="opacity: 0.95;">{{ overview }}</div>
        </div>
        {% endif %}

        <div class="passages-list">
            {% for passage in passages %}
            <div class="passage-item">
                <a href="/bible/{{ version }}/{{ passage.book|urlencode }}/{{ passage.chapter }}#{{ passage.verses.split('-')[0] }}" class="passage-reference">
                    {{ passage.reference }}
                </a>
                <div class="passage-text">{{ passage.text }}</div>
            </div>
            {% else %}
            <p>No passages found for this topic.</p>
            {% endfor %}
        </div>

        <div style="margin-top: 3rem; text-align: center;">
             <a href="/" class="primary-button" style="text-decoration: none; display: inline-block; padding: 0.8rem 1.5rem;">Ask AI Jesus about {{ topic_name }}</a>
        </div>
    </div>
</body>
</html>
