<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bible Topics & Themes | Athelstan</title>
    <meta name="description" content="Explore what the Holy Bible says about key life topics including love, forgiveness, anxiety, hope, faith, and relationships.">
    <meta name="keywords" content="bible topics, topical bible study, bible verses by topic, scripture on forgiveness, bible verses on anxiety, christian guidance">
    <link rel="canonical" href="{{ url_for('topics_index', _external=True) }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="Athelstan">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ url_for('topics_index', _external=True) }}">
    <meta property="og:title" content="Bible Topics & Themes | Athelstan">
    <meta property="og:description" content="Explore what the Holy Bible says about key life topics including love, forgiveness, anxiety, hope, faith, and relationships.">
    <meta property="og:image" content="https://wwaijd.org/img/wwaijd-metaimage.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ url_for('topics_index', _external=True) }}">
    <meta name="twitter:title" content="Bible Topics & Themes | Athelstan">
    <meta name="twitter:description" content="Explore what the Holy Bible says about key life topics including love, forgiveness, anxiety, hope, faith, and relationships.">
    <meta name="twitter:image" content="https://wwaijd.org/img/wwaijd-metaimage.png">

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "CollectionPage",
          "@id": "{{ url_for('topics_index', _external=True) }}#webpage",
          "url": "{{ url_for('topics_index', _external=True) }}",
          "name": "Bible Topics & Themes",
          "description": "Comprehensive directory of Bible topics and topical scripture verses."
        },
        {
          "@type": "BreadcrumbList",
          "@id": "{{ url_for('topics_index', _external=True) }}#breadcrumb",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://wwaijd.org/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Topics",
              "item": "{{ url_for('topics_index', _external=True) }}"
            }
          ]
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js"></script>
    <style>
        .topics-container {
            max-width: 950px;
            margin: 0 auto;
            padding: 2rem 1rem;
            color: var(--text-main);
        }
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .topic-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: var(--text-main);
            display: block;
        }
        .topic-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
            border-color: var(--accent);
            text-decoration: none;
        }
        .topic-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent);
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <div class="topics-container">
        <!-- Site Header Navigation Box -->
        <header class="site-header flow-box">
            <a href="/" class="header-brand">
                <span class="header-brand-icon">✝️</span>
                <span>Athelstan</span>
            </a>

            <nav class="header-nav">
                <a href="/" class="nav-item is-primary">💬 Ask Athelstan</a>
                <a href="/bible" class="nav-item is-primary">📖 Read Bible</a>
                <a href="/devotional" class="nav-item">🔥 Devotional</a>
                <a href="/prayers" class="nav-item">🙏 Prayer Wall</a>
                <a href="/plans" class="nav-item">📚 Plans</a>
                <a href="/topics" class="nav-item is-primary is-active">🏷️ Topics</a>
            </nav>

            <button type="button" id="themeToggleBtn" onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle Kindle Paperwhite mode">
                📖 Paperwhite
            </button>
        </header>

        <div class="flow-box" style="text-align: center; margin-bottom: 2rem;">
            <h1>Bible Topics & Themes</h1>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Explore what the scriptures say about these key life themes.</p>
        </div>

        <div class="topics-grid">
            {% for topic in topics %}
            <a href="/topics/{{ topic|lower|replace(' ', '-') }}" class="topic-card flow-box">
                <div class="topic-title">{{ topic }}</div>
            </a>
            {% endfor %}
        </div>

        <footer class="site-footer flow-box" style="margin-top: 3rem;">
            <div class="footer-links">
                <a href="/" class="footer-link">Home</a>
                <span class="separator">•</span>
                <a href="/bible" class="footer-link">Read the Bible</a>
                <span class="separator">•</span>
                <a href="/devotional" class="footer-link">Daily Devotional</a>
                <span class="separator">•</span>
                <a href="/plans" class="footer-link">Study Plans</a>
                <span class="separator">•</span>
                <button type="button" class="footer-link footer-share-btn" data-share-site title="Share Athelstan">Share</button>
            </div>
            <div class="copyright">
                &copy; 2025 Athelstan
            </div>
        </footer>
    </div>
</body>
</html>
